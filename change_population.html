<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Change Population - SOC2 Portal</title><link rel="stylesheet" href="/css/style.css"></head><body><div class="layout"><aside class="sidebar"><div class="sidebar-logo"><div><div class="sidebar-logo-text">SOC2 Portal</div><div class="sidebar-logo-sub">Audit Readiness</div></div></div><nav class="sidebar-nav" id="sidebar-nav"></nav></aside><div class="main"><header class="topbar"><div><div class="topbar-title">Change Population</div><div class="topbar-sub" id="subtitle">Read-only RRS ticket export</div></div><button class="btn btn-secondary btn-sm" onclick="exportCSV()">Export CSV</button></header><div class="content"><div class="stats-grid"><div class="stat-card"><div><div class="stat-value" id="total">-</div><div class="stat-label">Tickets</div></div></div><div class="stat-card"><div><div class="stat-value" id="changes">-</div><div class="stat-label">Likely Changes</div></div></div><div class="stat-card"><div><div class="stat-value" id="review">-</div><div class="stat-label">Need Review</div></div></div><div class="stat-card"><div><div class="stat-value" id="approved">-</div><div class="stat-label">With Approval</div></div></div></div><div class="toolbar"><div class="search-box"><input id="search" placeholder="Search tickets..." oninput="render()"></div><select id="scope" class="filter-select" onchange="render()"><option value="changes">Likely changes</option><option value="review">Needs review</option><option value="all">All tickets</option></select><span id="count" style="margin-left:auto;color:var(--text-secondary)"></span></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Subject</th><th>Status</th><th>Category</th><th>Created</th><th>Approval</th><th>Testing</th><th>Rollback</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div></div></div><script src="/js/api.js"></script><script src="/js/change_population.js"></script></body></html>
