<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workpapers - SOC2 Portal</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="layout"><aside class="sidebar"><div class="sidebar-logo"><div><div class="sidebar-logo-text">SOC2 Portal</div><div class="sidebar-logo-sub">Audit Readiness</div></div></div><nav class="sidebar-nav" id="sidebar-nav"></nav></aside>
<div class="main"><header class="topbar"><div><div class="topbar-title">Audit Workpapers</div><div class="topbar-sub" id="subtitle">Prior-report test activities rolled forward for the current period</div></div><button class="btn btn-secondary btn-sm" onclick="exportCSV()">Export CSV</button></header>
<div class="content"><div class="stats-grid"><div class="stat-card"><div><div class="stat-value" id="wp-total">-</div><div class="stat-label">Test Activities</div></div></div><div class="stat-card"><div><div class="stat-value" id="wp-tested">-</div><div class="stat-label">Tested</div></div></div><div class="stat-card"><div><div class="stat-value" id="wp-ready">-</div><div class="stat-label">Ready</div></div></div><div class="stat-card"><div><div class="stat-value" id="wp-exceptions">-</div><div class="stat-label">Exceptions</div></div></div></div>
<div class="toolbar"><div class="search-box"><input id="search" placeholder="Search workpapers..." oninput="filterWorkpapers()"></div><select id="control-filter" class="filter-select" onchange="filterWorkpapers()"><option value="">All controls</option></select><select id="status-filter" class="filter-select" onchange="filterWorkpapers()"><option value="">All statuses</option><option value="not_started">Not started</option><option value="in_progress">In progress</option><option value="ready">Ready for test</option><option value="tested">Tested</option><option value="exception">Exception</option><option value="not_applicable">Not applicable</option></select><span id="count" style="margin-left:auto;color:var(--text-secondary)"></span></div>
<div class="card"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Activity</th><th>Frequency</th><th>Prior result</th><th>Population</th><th>Status</th><th>Evidence</th><th></th></tr></thead><tbody id="tbody"></tbody></table></div></div></div></div></div>
<div class="modal-overlay hidden" id="edit-modal"><div class="modal"><div class="modal-header"><span class="modal-title" id="modal-title"></span><button class="modal-close" onclick="closeModal('edit-modal')">&times;</button></div><div class="modal-body"><div class="form-group"><label class="form-label">Activity</label><div id="activity" style="line-height:1.5"></div></div><div class="form-row"><div class="form-group"><label class="form-label">Status</label><select class="form-control" id="wp-status"><option value="not_started">Not started</option><option value="in_progress">In progress</option><option value="ready">Ready for test</option><option value="tested">Tested</option><option value="exception">Exception</option><option value="not_applicable">Not applicable</option></select></div><div class="form-group"><label class="form-label">Owner ID</label><input class="form-control" id="wp-owner"></div></div><div class="form-group"><label class="form-label">Population source</label><textarea class="form-control" id="wp-population" placeholder="System/report and complete population definition"></textarea></div><div class="form-group"><label class="form-label">Sample references (one per line)</label><textarea class="form-control" id="wp-samples"></textarea></div><div class="form-group"><label class="form-label">Management testing conclusion</label><textarea class="form-control" id="wp-conclusion"></textarea></div><div class="form-group"><label class="form-label">Exception / remediation</label><textarea class="form-control" id="wp-exception"></textarea></div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal('edit-modal')">Cancel</button><button class="btn btn-primary" onclick="saveWorkpaper()">Save</button></div></div></div>
<script src="/js/api.js"></script><script src="/js/audit_tests.js"></script></body></html>
