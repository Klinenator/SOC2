server {
    listen 80;
    server_name soc2.rrsaccess.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name soc2.rrsaccess.com;
    root /var/www/SOC2;
    index index.html;
    charset utf-8;
    client_max_body_size 50m;

    ssl_certificate /etc/letsencrypt/live/soc2.rrsaccess.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soc2.rrsaccess.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location ~ ^/(data|uploads|scripts|\.git)/ {
        deny all;
        return 403;
    }

    location = /api/auth.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location = /_soc2_auth_check {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api/auth.php;
        fastcgi_param QUERY_STRING action=check;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ ^/api/.*\.php$ {
        auth_request /_soc2_auth_check;
        try_files $uri =404;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "private";
    }

    location @oauth_login { return 302 /api/auth.php?action=login; }
    location / {
        auth_request /_soc2_auth_check;
        error_page 401 = @oauth_login;
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
